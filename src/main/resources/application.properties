spring.application.name=belajar

# ===============================
# Konfigurasi Database MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/belajar_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ===============================
# Konfigurasi JPA / Hibernate
# ===============================
# 'validate' memastikan Hibernate hanya memvalidasi kesesuaian skema dengan Entity
# Pembuatan dan perubahan tabel diserahkan sepenuhnya ke Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Konfigurasi Database Migration (Flyway)
# ===============================
spring.flyway.enabled=true
# baseline-on-migrate=true menjaga kecocokan jika database lokal sudah memiliki tabel sebelumnya
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===============================
# Konfigurasi Swagger / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ===============================
# Konfigurasi JWT (JSON Web Token)
# ===============================
jwt.secret=belajarCrudSpringBootSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Security1234567890
# 86400000 ms = 24 jam
jwt.expiration-ms=86400000

# ===============================
# Konfigurasi Spring Boot Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
